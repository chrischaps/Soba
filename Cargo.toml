[package]
name = "soba"
version = "0.8.0"
edition = "2021"
# egui 0.37's (CI builds on the newer Rust ci.yml pins)
rust-version = "1.95"
description = "A node-based modular audio synthesizer"
authors = ["Chris"]
license = "MIT"
default-run = "soba"

# The CLAP plugin (plugin/) builds on this crate. A plain `cargo build` or
# `cargo test` here leaves it out; `cargo build -p soba-plugin` builds it
[workspace]
members = [".", "plugin"]

[features]
# Low-latency audio through an interface's ASIO driver (Windows). Needs LLVM
# (libclang) to build; see docs/src/getting-started/installation.md
asio = ["cpal/asio", "dep:image"]
# The Clock's Link source: tempo, beat and start/stop shared with Ableton
# Link peers on the network. The Link SDK is GPLv2+, so builds with it are
# too. Needs CMake and LLVM (libclang); see docs/src/getting-started/installation.md
ableton-link = ["dep:rusty_link"]
# The browser build's sound from the browser's audio thread, in an
# AudioWorklet, rather than between the page's frames (#375). Needs wasm
# threads: a nightly toolchain and tools/web/build.py (WEB.md)
web-worklet = ["cpal/audioworklet"]

# CI runs `cargo clippy --workspace --all-targets -- -D warnings`. These two
# are matters of taste here: index loops over parallel tables read better than
# zipped iterators, and the long types are mostly tests' tuples
[lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
# glow, not wgpu (eframe's default since 0.34): a smaller, quicker build, the
# OpenGL the plugin draws with too, and WebGL in the browser. Since 0.37 the
# clipboard and opening links are features too, and so are the default fonts
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "web_screen_reader", "x11"] }
# The emoji faces hold the Mac's ⌘ and ⇧, and symbols the faces draw: a
# feature of their own since 0.37
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Pinned: bump the rev on purpose, after a push to the fork
egui_node_graph2 = { git = "https://github.com/chrischaps/egui_node_graph2", rev = "1ff971fddd098c9de27f1fe3f81a5fc711f3427e" }
cpal = "0.18"
midir = "0.11"
rtrb = "0.3"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5.1"
dirs = "6"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
# Decodes Steinberg's ASIO Compatible logo, which ASIO builds show
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# std::time's clocks panic in the browser; this is std's on the desktop
web-time = "1.1"
triple_buffer = "9.0.0"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "vorbis", "flac", "ogg"] }
# Opus in Ogg, which symphonia 0.6 still splits into packets but cannot decode
opus-decoder = "0.1.1"
# Patch links (persistence/patch_link.rs): the patch deflated into the URL
miniz_oxide = "0.8"
base64 = "0.22"

# Updates (src/app/update): one request to GitHub's releases API, then the
# release's zip, checked against its SHA256SUMS before it's unpacked
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3.4"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# Ableton Link, through the SDK's C wrapper (the ableton-link feature)
rusty_link = { version = "0.4.9", optional = true }

# The browser build (`trunk build`, see index.html): sound through WebAudio,
# files through downloads and uploads, and the examples' samples fetched
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "UrlSearchParams", "Navigator", "Response", "RequestInit", "History", "console", "Performance", "MidiAccess", "MidiInput", "MidiOutput", "MidiInputMap", "MidiOptions", "MidiOutputMap", "MidiPort", "MidiPortDeviceState", "MidiMessageEvent"] }

# The app icon in the Windows executable (build.rs)
[build-dependencies]
winresource = "0.1"

# Where the cursor is while a file is dragged over the window, which
# winit doesn't say on Windows (already in the tree through winit), and
# whether the session that left takes in temp is still running
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# cargo run plays the examples, and unoptimised it can't: Canopy rendered at
# a third of real time and Lush Pad barely above it (#346). Level 1 for our
# code keeps debug assertions and overflow checks and still builds quickly;
# the dependencies (egui, cpal, serde) build once, so they get level 2
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# cpal's ASIO clock adds 49.7 days whenever a driver's timestamp steps back
# a little (Focusrite's do, several times a second), so it overflows after
# about ten minutes. Release builds wrap past it harmlessly; a debug build
# would panic on the audio thread
[profile.dev.package.cpal]
overflow-checks = false

# cargo test renders whole patches offline, which crawls unoptimised. Level 1
# ran the suite in 38 s rather than 235 s for 22 s more build, and keeps debug
# assertions and overflow checks (#272). Level 2 built twice as long again
# for 9 s more
[profile.test]
opt-level = 1

