# The short-link service (#370, built by #376). `npx wrangler dev` runs it
# locally with a local D1 database, `npx wrangler deploy` publishes it. See docs/SHORT_LINKS.md.
name = "soba-links"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Named, so a D1-only API token (the archive workflow's, #389) needn't be
# allowed to list accounts to find it. An account ID isn't a secret
account_id = "a2ad79871aad2f54eb9d36d0138e7a7e"

[[d1_databases]]
binding = "DB"
database_name = "soba-links"
database_id = "57a55161-4ee3-45f6-a521-4759bb57b8fa"

# Ten new links a minute from one address. Sharing the same patch again
# counts too, though it stores nothing
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
