<!doctype html>
<html lang="en">
<!--
  The Patch Garden, soba.chaps.dev/garden/ (#393): patches people planted,
  each card drawn from the patch itself. garden.js pages through the link
  service's GET /v1/garden and draws every patch as a small cable diagram
  from modules.json (#390). listen.js plays a card as it's hovered,
  through one hidden listener, /?listen (#391, #394). .github/workflows/docs.yml copies this folder
  into the app's site. To try it against `wrangler dev`, serve packaging/web
  at 127.0.0.1:8080 and open /garden/?api=http://127.0.0.1:8787, adding
  &app=http://127.0.0.1:8081 for a `trunk serve --port 8081` to listen with
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Patches people have grown in Soba, the node-based modular synthesizer. Each card is drawn from the patch's own cables.">
<title>Patch Garden · Soba</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='10' height='12' rx='2' fill='%2342a5f5'/%3E%3Crect x='20' y='16' width='10' height='12' rx='2' fill='%237e57c2'/%3E%3Cpath d='M12 10C18 10 14 22 20 22' fill='none' stroke='%2342f587' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="garden.css">
<script src="listen.js" defer></script>
<script src="garden.js" defer></script>
</head>
<body>
<header class="masthead">
    <a class="home" href="/">Soba</a>
    <h1>Patch Garden</h1>
    <p class="lede">Patches people have grown in Soba. Each picture is the patch itself, drawn from its modules and cables: a drone grows sparse, a drum machine dense. Rest the pointer on one, or tap it, to hear it.</p>
    <ul class="legend" aria-label="Cable colours">
        <li class="audio">Audio</li>
        <li class="control">Control</li>
        <li class="gate">Gate</li>
        <li class="midi">MIDI</li>
        <li class="bus">Bus</li>
    </ul>
</header>
<main>
    <div id="garden" class="garden"></div>
    <p id="status" class="status" role="status">Gathering the garden…</p>
    <div id="more" aria-hidden="true"></div>
</main>
<noscript><p class="status">The garden draws its patches with JavaScript, which is turned off here.</p></noscript>
</body>
</html>
