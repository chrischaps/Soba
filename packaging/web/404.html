<!doctype html>
<html lang="en">
<!--
  soba.chaps.dev's 404.html: GitHub Pages serves it for any address with no
  file. A short patch link, /s/<id>, has none, so this is where one lands. It
  hands the ID to the app as /#s=<id>, and the app fetches the patch from
  the link service (src/persistence/short_link.rs, docs/SHORT_LINKS.md).
  Anything else is a plain not-found page. .github/workflows/docs.yml puts
  it in the app's site.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Soba</title>
<script>
    (function () {
        // The same IDs short_link::is_id takes
        var short = location.pathname.match(/^\/s\/([0-9A-Za-z]{6,16})\/?$/);
        if (short) location.replace("/#s=" + short[1]);
    })();
</script>
<style>
    :root { color-scheme: dark; }
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1a1a2e radial-gradient(circle at 1px 1px, #ffffff0d 1px, transparent 0) 0 0 / 24px 24px;
        color: #c8c8d8;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
        max-width: 30rem;
        margin: 16px;
        padding: 0 0 24px;
        background: #22223a;
        border: 1px solid #2e2e4a;
        border-radius: 10px;
        overflow: hidden;
    }
    /* A utility module's grey header: nothing here makes a sound */
    header {
        background: #9e9e9e;
        color: #1a1a2e;
        padding: 8px 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
    }
    p { margin: 16px 20px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 20px 0; }
    a.button {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #4fc3f7;
        background: #4fc3f7;
        color: #1a1a2e;
        font-weight: 600;
        text-decoration: none;
    }
    a.button:hover { filter: brightness(1.15); }
    a.button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
    <header>Nothing here</header>
    <p>This address doesn't lead to anything in Soba. If someone sent it to you as a patch link, it may have been cut short: ask them to send it again.</p>
    <div class="actions">
        <a class="button" href="/">Open Soba</a>
    </div>
</main>
</body>
</html>
