[package]
name = "soba-plugin"
version = "0.7.0"
edition = "2021"
description = "Soba as a CLAP instrument"
authors = ["Chris"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Process allocations end the plugin in debug builds (nih-plug's guard)
assert_process_allocs = ["nih_plug/assert_process_allocs"]

[dependencies]
soba = { path = ".." }
# CLAP only: the VST3 wrapper is GPL (see the issue), so it's left out
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
# nih_plug_egui pins egui 0.31; this is the same glue on the egui Soba uses
# (0.30), at the baseview nih-plug's own editors use
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "eed0cb69cd63f2cacc0e8a1afc227e79ab59393e", default-features = false, features = ["opengl", "default_fonts"] }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
raw-window-handle = "0.5"
egui = "0.30"
parking_lot = "0.12"
rtrb = "0.3"
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
