[package]
name = "soba-plugin"
version = "0.7.0"
edition = "2021"
description = "Soba as a CLAP instrument"
authors = ["Chris"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Process allocations end the plugin in debug builds (nih-plug's guard)
assert_process_allocs = ["nih_plug/assert_process_allocs"]
# A VST3 plugin too, for DAWs without CLAP (Ardour, Cubase). nih-plug's VST3
# wrapper is built on vst3-sys, which is GPLv3, so a build with this feature
# is GPLv3 as well. Without it the plugin is CLAP only and stays MIT
vst3 = ["nih_plug/vst3"]

[dependencies]
soba = { path = ".." }
# CLAP, and VST3 with the vst3 feature (its wrapper is GPL)
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
# The egui glue nih_plug_egui uses (egui 0.31), at the same rev, with the
# baseview nih-plug's own editors use. The egui_31 branch's head doesn't build
# on its own (its log macros aren't imported)
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", default-features = false, features = ["opengl", "default_fonts"] }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
raw-window-handle = "0.5"
egui = "0.31"
parking_lot = "0.12"
rtrb = "0.3"
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
