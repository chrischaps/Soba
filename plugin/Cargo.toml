[package]
name = "soba-plugin"
version = "0.7.0"
edition = "2021"
description = "Soba as a CLAP instrument"
authors = ["Chris"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Process allocations end the plugin in debug builds (nih-plug's guard)
assert_process_allocs = ["nih_plug/assert_process_allocs"]
# A VST3 plugin too, for DAWs without CLAP (Ardour, Cubase). nih-plug's VST3
# wrapper is built on vst3-sys, which is GPLv3, so a build with this feature
# is GPLv3 as well. Without it the plugin is CLAP only and stays MIT
vst3 = ["nih_plug/vst3"]

[dependencies]
soba = { path = ".." }
# CLAP, and VST3 with the vst3 feature (its wrapper is GPL)
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
# The egui glue, from our fork of BillyDM's (its `soba` branch, checked out
# beside this repo at ../egui-baseview), since upstream stops at egui 0.33.
# It's at upstream's egui_33 head (egui 0.33), with the baseview that branch
# pins. Its log macros come from `tracing` (or nih-plug's `nih_log`): without
# one of the two it doesn't build
egui-baseview = { git = "https://github.com/chrischaps/egui-baseview.git", rev = "5cf93206def5984b67847caefd30d01612b629b8", default-features = false, features = ["opengl", "default_fonts", "tracing"] }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "237d323c729f3aa99476ba3efa50129c5e86cad3" }
raw-window-handle = "0.5"
egui = "0.33"
parking_lot = "0.12"
rtrb = "0.3"
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
