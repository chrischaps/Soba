name: Deploy Docs

# Deploys once CI on master is green, never from a red commit. Pushes land
# close together (several sessions plus the nightly [Docs] commit), so one
# deploy runs at a time and a newer one cancels an older one in flight. The
# site records the Soba commit it was built from (soba/SOURCE): a run whose
# commit is older than that never publishes, and a run with nothing new for
# the site stops before building
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout Soba
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          # The whole history, to compare with the commit the site holds
          fetch-depth: 0

      - name: Checkout docs site repo
        uses: actions/checkout@v4
        with:
          repository: chrischaps/docs.chaps.dev
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: docs-site

      # What the sites show: the manual, and the app in the browser at
      # soba.chaps.dev. A manual run rebuilds even when nothing changed
      - name: Is there anything new to deploy?
        id: check
        run: |
          deployed=$(cat docs-site/soba/SOURCE 2>/dev/null || true)
          deploy=true
          if [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "The site's commit is unknown here: deploying ${SHA::7}"
          elif [ "$deployed" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$deployed"; then
            echo "The site holds ${deployed::7}, newer than ${SHA::7}: not deploying"
            deploy=false
          elif [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git diff --quiet "$deployed" "$SHA" -- \
              docs src patches assets index.html Trunk.toml Cargo.toml Cargo.lock \
              packaging/web tools/web/build.py .github/workflows/docs.yml; then
            echo "Nothing the site shows changed between ${deployed::7} and ${SHA::7}"
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Install mdBook
        if: steps.check.outputs.deploy == 'true'
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Build docs
        if: steps.check.outputs.deploy == 'true'
        run: mdbook build docs

      # The threaded build needs a nightly for -Z build-std (tools/web/build.py
      # names the same one). Installed first, so stable is left the default
      - name: Install the nightly for the threaded build
        if: steps.check.outputs.deploy == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-17
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install Rust toolchain
        if: steps.check.outputs.deploy == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        if: steps.check.outputs.deploy == 'true'
        uses: Swatinem/rust-cache@v2

      # trunk fetches wasm-bindgen and wasm-opt itself
      - name: Install trunk
        if: steps.check.outputs.deploy == 'true'
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/

      # Twice, into one dist/: threaded for a cross-origin isolated page, which
      # renders sound in an AudioWorklet, and plain for the rest (#375)
      - name: Build the app for the browser
        if: steps.check.outputs.deploy == 'true'
        run: python3 tools/web/build.py

      # soba.chaps.dev is GitHub Pages on its own repo, whose CNAME file names
      # the domain. Trunk.toml's relative public_url serves from the root.
      # Pushed before the docs, so the old address never forwards to an app
      # that isn't there yet. The docs site's SOURCE stands for both
      - name: Checkout app site repo
        if: steps.check.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          repository: chrischaps/soba.chaps.dev
          ssh-key: ${{ secrets.SOBA_DEPLOY_KEY }}
          path: app-site

      - name: Push to app site
        if: steps.check.outputs.deploy == 'true'
        run: |
          cd app-site
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../dist/. .
          # Short patch links, /s/<id>, have no file: this hands them to the app
          cp ../packaging/web/404.html .
          # The Patch Garden, soba.chaps.dev/garden/ (#393)
          cp -r ../packaging/web/garden .
          echo soba.chaps.dev > CNAME
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Update Soba to ${SHA::7}"
          git push

      # The app played at /soba/play/ until it had a site of its own (#371).
      # That address now forwards there, keeping ?patch=, ?open= and #p=
      # links, and keeps a copy of the app at play/stay/ for visitors whose
      # unsaved work is in this site's browser storage
      - name: Copy built docs
        if: steps.check.outputs.deploy == 'true'
        run: |
          rm -rf docs-site/soba
          cp -r docs/book docs-site/soba
          mkdir docs-site/soba/play
          cp packaging/web/moved.html docs-site/soba/play/index.html
          cp -r dist docs-site/soba/play/stay
          echo "$SHA" > docs-site/soba/SOURCE

      # Until the rename, the manual lived at /modular/. Each page there now
      # forwards to the same page under /soba/, keeping ?patch=… and #anchors
      - name: Forward the old addresses
        if: steps.check.outputs.deploy == 'true'
        run: |
          rm -rf docs-site/modular
          cd docs-site/soba
          find . -name '*.html' | while read -r page; do
            page="${page#./}"
            target="/soba/${page%index.html}"
            mkdir -p "../modular/$(dirname "$page")"
            printf '<!doctype html><meta charset="utf-8"><title>Soba</title><link rel="canonical" href="%s"><script>location.replace("%s" + location.search + location.hash)</script><meta http-equiv="refresh" content="0; url=%s"><p>This page is now at <a href="%s">docs.chaps.dev%s</a>.</p>\n' \
              "$target" "$target" "$target" "$target" "$target" > "../modular/$page"
          done

      # The site repo may have moved on under this run (another project's
      # deploy): replay this commit on top of it and push again
      - name: Push to docs site
        if: steps.check.outputs.deploy == 'true'
        run: |
          cd docs-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && exit 0
          git commit -m "Update Soba docs to ${SHA::7}"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1
