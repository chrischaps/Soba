name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      # The allocation guard on its own, so a real-time regression is named
      # in the job summary rather than buried in the full run
      - name: Audio thread allocation guard
        run: cargo test --test realtime_alloc

      # ASIO is an opt-in Windows build: check it still compiles. The runner
      # has LLVM for bindgen; the build fetches Steinberg's ASIO SDK. Its
      # PowerShell unzip fails under pwsh's module path, so that's cleared
      - name: Check the ASIO build
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: env -u PSModulePath cargo check --features asio --all-targets

  # The browser build (index.html, built with trunk by the docs workflow):
  # check it still compiles for wasm32
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the web build
        run: cargo check --target wasm32-unknown-unknown --bin soba

  # A push to master that fails opens one issue labelled ci-failure, or
  # comments on the one already open, so the next session sees it without
  # watching CI. The next green push to master closes it
  report:
    needs: [test, web]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: CI fails on master
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      GREEN: ${{ needs.test.result == 'success' && needs.web.result == 'success' }}

    steps:
      - name: Open, update or close the ci-failure issue
        run: |
          open=$(gh issue list --label ci-failure --state open --json number,title \
            -q "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "$FAILED" = "true" ]; then
            body="The push of ${SHA::7} fails CI: $RUN"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$TITLE" --label ci-failure --body "$body"
            fi
          elif [ "$GREEN" = "true" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again at ${SHA::7}: $RUN"
          fi
