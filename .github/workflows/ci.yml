name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned, so a new stable's lints can't turn master red overnight. Bump it
  # on purpose: `cargo +<new> clippy --workspace --all-targets -- -D warnings`
  # (and `cargo +<new> fix` for any rustc lint) first, then here
  RUST_TOOLCHAIN: 1.99.1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      # The Python tools (tools/) run unattended at night: a syntax error
      # in one should fail here, not at 03:00
      - name: Compile the Python tools
        run: python -m compileall -q tools

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Against Cargo.lock as committed: a dependency that drifted fails
      # here rather than in someone's next build. The allocation guard
      # (tests/realtime_alloc.rs) is part of this run
      - name: Test
        run: cargo test --locked

      # No warnings, rustc's or clippy's. The few lints this repo allows are
      # in Cargo.toml's [lints.clippy]. On Windows the CLAP plugin as well,
      # whose window needs nothing installed there
      - name: Clippy
        shell: bash
        run: cargo clippy --locked --all-targets ${{ matrix.os == 'windows-latest' && '--workspace' || '' }} -- -D warnings

      # The CLAP plugin (plugin/): its app, player and state, without a DAW.
      # Windows only, where its window's OpenGL needs nothing installed
      - name: Test the CLAP plugin
        if: matrix.os == 'windows-latest'
        run: cargo test -p soba-plugin

      # ...and its VST3 build (the vst3 feature) still compiles
      - name: Check the VST3 plugin
        if: matrix.os == 'windows-latest'
        run: cargo check -p soba-plugin --features vst3

      # ASIO is an opt-in Windows build: check it still compiles. The runner
      # has LLVM for bindgen; the build fetches Steinberg's ASIO SDK. Its
      # PowerShell unzip fails under pwsh's module path, so that's cleared
      - name: Check the ASIO build
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: env -u PSModulePath cargo check --features asio --all-targets

  # The browser build (index.html, built with trunk by the docs workflow):
  # check it still compiles for wasm32
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Clippy stays on the desktop builds: in the browser, std's stub
      # files and processes trip lints that mean nothing there
      - name: Check the web build
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --target wasm32-unknown-unknown --bin soba

  # The releases build two macOS targets (release.yml): check they still
  # compile, warning-free, before a tag finds out
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # A push to master that fails opens one issue labelled ci-failure, or
  # comments on the one already open, so the next session sees it without
  # watching CI. The next green push to master closes it
  report:
    needs: [test, web, macos]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: CI fails on master
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      GREEN: ${{ needs.test.result == 'success' && needs.web.result == 'success' && needs.macos.result == 'success' }}

    steps:
      - name: Open, update or close the ci-failure issue
        run: |
          open=$(gh issue list --label ci-failure --state open --json number,title \
            -q "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "$FAILED" = "true" ]; then
            body="The push of ${SHA::7} fails CI: $RUN"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$TITLE" --label ci-failure --body "$body"
            fi
          elif [ "$GREEN" = "true" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again at ${SHA::7}: $RUN"
          fi
