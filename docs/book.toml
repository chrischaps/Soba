[book]
authors = ["Chris"]
language = "en"
src = "src"
title = "Soba Documentation"
description = "A node-based modular audio synthesizer in Rust"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
site-url = "/soba/"
git-repository-url = "https://github.com/chrischaps/Soba"
edit-url-template = "https://github.com/chrischaps/Soba/edit/master/docs/{path}"
no-section-label = false
additional-css = ["theme/custom.css"]

# The songs were recipes until they had a part of their own
[output.html.redirect]
"/recipes/from-one-sine.html" = "../songs/from-one-sine.html"
"/recipes/clair-de-satellite.html" = "../songs/clair-de-satellite.html"
"/recipes/canopy.html" = "../songs/canopy.html"

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
