<!DOCTYPE html>
<html lang="en">
<!--
  Soba in the browser. Build with trunk (https://trunkrs.dev):
    trunk serve            # http://127.0.0.1:8080, rebuilt on save
    trunk build --release  # into dist/
    python tools/web/build.py  # into dist/ with the threaded build too, for soba.chaps.dev
  Add ?patch=lush-pad to embed an example (just the canvas and a Play
  button), or ?open=lush-pad to open it in the full app.
-->
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Soba</title>
    <meta name="description" content="A node-based modular synthesizer, playable in the browser." />

    <link data-trunk rel="rust" data-bin="soba" data-wasm-opt="3" />
    <!-- The examples' samples, fetched when a patch first plays one rather
         than carried in the wasm (src/persistence/example_fetch.rs) -->
    <link data-trunk rel="copy-dir" href="patches/samples" />
    <link data-trunk rel="copy-file" href="packaging/web/isolate-sw.js" />

    <script>
        // Whether to run the threaded build, which renders sound on the
        // browser's audio thread (#375). It needs a cross-origin isolated
        // page, which isolate-sw.js makes this one: the first visit
        // registers it and loads the page again, through it, and this
        // promise never settles meanwhile. tools/web/build.py's loader asks;
        // a plain trunk build doesn't, and runs as before.
        //
        // Embeds stay as they were (the page around one isn't isolated), and
        // so does Safari until it's been heard on real hardware (WEB.md).
        window.sobaIsolate = () => new Promise((use) => {
            if (window.crossOriginIsolated) return use(true);
            const agent = navigator.userAgent;
            const safari = /AppleWebKit/.test(agent) && !/Chrome|Chromium|Edg/.test(agent);
            const embed = new URLSearchParams(location.search).has("patch");
            const workers = navigator.serviceWorker;
            if (embed || safari || !workers || !window.isSecureContext) return use(false);
            // Once a tab: a browser that won't isolate the page this way isn't
            // loaded over and over (nor is a hard reload, which skips the worker)
            try {
                if (sessionStorage.getItem("soba-isolating")) return use(false);
                sessionStorage.setItem("soba-isolating", "1");
            } catch (e) {
                return use(false);
            }
            // Anything unexpected on the way runs the plain build instead
            workers.register("./isolate-sw.js").then((registration) => {
                const worker = registration && (registration.installing || registration.waiting || registration.active);
                if (!worker) return use(false);
                // A worker that never starts mustn't keep the app from it, nor
                // reload it later, once it's running
                let waiting = true;
                const settle = () => {
                    if (!waiting) return;
                    if (worker.state === "activated") location.reload();
                    else if (worker.state === "redundant") use(false);
                    else return;
                    waiting = false;
                };
                worker.addEventListener("statechange", settle);
                settle();
                setTimeout(() => { if (waiting) { waiting = false; use(false); } }, 5000);
            }).catch(() => use(false));
        });
    </script>

    <script>
        // Browsers hold a page's sound until it's clicked or a key is pressed
        // (their autoplay rule), and Safari only lets go inside the click
        // itself. So every audio context the app makes is noted here and
        // resumed from the first gesture, and the app asks
        // sobaAudioBlocked() to show "Click to start sound" until then.
        (function () {
            const contexts = [];
            const Native = window.AudioContext || window.webkitAudioContext;
            if (!Native) return;
            class TrackedAudioContext extends Native {
                constructor(...args) {
                    super(...args);
                    contexts.push(this);
                }
            }
            window.AudioContext = TrackedAudioContext;
            const resume = () => contexts.forEach((c) => c.state === "suspended" && c.resume());
            for (const gesture of ["pointerdown", "pointerup", "keydown", "touchend"]) {
                window.addEventListener(gesture, resume, { capture: true });
            }
            window.sobaAudioBlocked = () => contexts.some((c) => c.state === "suspended");

            // A threaded build on a cross-origin isolated page renders in an
            // AudioWorklet, on the browser's audio thread (#375). Before
            // cpal's processor module loads, this one gives that thread a
            // clock and times each render for sobaAudioStats.
            if (window.AudioWorklet) {
                const shim = (offset) => {
                    // web-time's Instant reads performance, which a worklet's
                    // scope may lack: Date's clock stands in, set to agree
                    // with the page's (timeOrigin + now), so MIDI stamped on
                    // the page lands where it should
                    const native = typeof globalThis.performance !== "undefined";
                    if (!native) globalThis.performance = { timeOrigin: offset, now: () => Date.now() };
                    const register = globalThis.registerProcessor;
                    globalThis.registerProcessor = (name, Processor) => register(name, class extends Processor {
                        constructor(...args) {
                            super(...args);
                            this.stats = { buffers: 0, slow: 0, gaps: 0, gapMs: 0, peak: 0, renders: [], budgetMs: 0, clock: native ? "performance" : "Date" };
                            this.behind = Infinity;
                        }
                        process(inputs, outputs, parameters) {
                            const t0 = performance.now();
                            const result = super.process(inputs, outputs, parameters);
                            const ms = performance.now() - t0;
                            const stats = this.stats;
                            const channel = outputs[0][0] ?? [];
                            // Longer than the quantum lasts: the thread fell behind
                            const budget = (1000 * channel.length) / sampleRate;
                            if (ms > budget) stats.slow += 1;
                            stats.budgetMs += budget;
                            // The audio clock counts only the sound made, so a
                            // dropout leaves it further behind the wall clock
                            // for good. Quanta come in bursts, a device buffer
                            // at a time, so only a step past that counts
                            const behind = Date.now() - currentTime * 1000;
                            if (behind > this.behind + 30) {
                                stats.gaps += 1;
                                stats.gapMs += behind - this.behind;
                                this.behind = behind;
                            }
                            this.behind = Math.min(this.behind, behind);
                            stats.buffers += 1;
                            stats.renders.push(ms);
                            if (stats.buffers % 8 === 0) for (const x of channel) stats.peak = Math.max(stats.peak, Math.abs(x));
                            if (stats.buffers % 64 === 0) {
                                this.port.postMessage({ sobaStats: stats });
                                stats.renders = [];
                                stats.budgetMs = 0;
                            }
                            return result;
                        }
                    });
                };
                const addModule = AudioWorklet.prototype.addModule;
                AudioWorklet.prototype.addModule = function (url, ...rest) {
                    const offset = performance.timeOrigin + performance.now() - Date.now();
                    const module = URL.createObjectURL(new Blob([`(${shim})(${offset});`], { type: "text/javascript" }));
                    return addModule.call(this, module).then(() => addModule.call(this, url, ...rest));
                };
                // The processor's numbers arrive on its node's port
                const NativeNode = window.AudioWorkletNode;
                window.AudioWorkletNode = class extends NativeNode {
                    constructor(context, ...args) {
                        super(context, ...args);
                        this.port.onmessage = (e) => {
                            const s = e.data && e.data.sobaStats;
                            if (!s) return;
                            for (const ms of s.renders) {
                                renderMs = renderMs * 0.995 + ms * 0.005;
                                renderMax = Math.max(renderMax, ms);
                            }
                            (window.sobaWorkletRenders ??= []).push(...s.renders);
                            // The load over the batch, as Date's whole
                            // milliseconds add up truly over many renders
                            const load = s.renders.reduce((a, b) => a + b, 0) / s.budgetMs;
                            workletLoad = workletLoad * 0.8 + load * 0.2;
                            workletLoadPeak = Math.max(workletLoadPeak, load);
                            // Chrome counts its own underruns
                            const playback = context.playbackStats;
                            worklet = { ...s, renders: undefined, budgetMs: undefined, load: Math.round(workletLoad * 100), underruns: playback ? playback.underrunEvents : undefined, latencyMs: Math.round((context.baseLatency + (context.outputLatency || 0)) * 1000) };
                        };
                    }
                };
            }
            let worklet = null, renderMs = 0, renderMax = 0, workletLoad = 0, workletLoadPeak = 0;

            // The app's sound arrives as buffers, each scheduled to start as
            // the one before ends (cpal's WebAudio host). If the page is busy
            // for longer than a buffer, one is scheduled for a moment already
            // past, and cpal never catches up: every buffer after it would
            // start early, over the one still playing. So the schedule is
            // moved on by however late it fell, leaving one gap (a dropout)
            // instead of garbled sound from then on. The dropouts are counted
            // in sobaAudioStats, for the browser tests.
            const stats = { buffers: 0, late: 0, lagMs: 0, peak: 0, renderMs: 0, renderMaxMs: 0, load: 0 };
            window.sobaAudioStats = () => worklet ? { ...worklet, host: "audioworklet", renderMs: +renderMs.toFixed(2), renderMaxMs: +renderMax.toFixed(2), contexts: contexts.map((c) => c.state) } : ({ ...stats, host: "webaudio", lagMs: Math.round(stats.lagMs), renderMs: +stats.renderMs.toFixed(1), renderMaxMs: +stats.renderMaxMs.toFixed(1), load: Math.round(stats.load * 100), contexts: contexts.map((c) => c.state) });
            // The status bar's meter (src/app/web.rs): how much of each
            // buffer's time went to the page, as a percentage. A buffer's
            // `ended` must render the next one before the buffer playing
            // now runs out, so the time it waited for the page to finish a
            // frame counts as well as the render: at 100% a buffer comes out
            // late. `peak` is the busiest buffer since the last call. In an
            // AudioWorklet it's the audio thread's share instead, its renders
            // only, and its dropouts.
            let loadPeak = 0;
            window.sobaAudioLoad = () => {
                const load = worklet
                    ? { late: worklet.underruns ?? worklet.gaps, average: workletLoad * 100, peak: workletLoadPeak * 100 }
                    : { late: stats.late, average: stats.load * 100, peak: loadPeak * 100 };
                workletLoadPeak = 0;
                loadPeak = 0;
                return load;
            };
            // When each buffer was scheduled to finish
            const ends = new WeakMap();
            // How long the app takes to render each buffer, which is the
            // time the page's thread is busy with sound rather than drawing
            const listen = AudioBufferSourceNode.prototype.addEventListener;
            AudioBufferSourceNode.prototype.addEventListener = function (type, fn, ...rest) {
                if (type !== "ended") return listen.call(this, type, fn, ...rest);
                return listen.call(this, type, function (...args) {
                    const end = ends.get(this);
                    const waitMs = end === undefined ? 0 : Math.max(0, this.context.currentTime - end) * 1000;
                    const t0 = performance.now();
                    const result = fn.apply(this, args);
                    const ms = performance.now() - t0;
                    stats.renderMs = stats.renderMs * 0.95 + ms * 0.05;
                    stats.renderMaxMs = Math.max(stats.renderMaxMs, ms);
                    if (this.buffer) {
                        const load = (waitMs + ms) / (this.buffer.duration * 1000);
                        stats.load = stats.load * 0.95 + load * 0.05;
                        loadPeak = Math.max(loadPeak, load);
                    }
                    return result;
                }, ...rest);
            };
            const start = AudioBufferSourceNode.prototype.start;
            const lag = new WeakMap();
            AudioBufferSourceNode.prototype.start = function (when = 0, ...rest) {
                const ctx = this.context;
                if (when > 0) {
                    let shift = lag.get(ctx) || 0;
                    // A safety margin of 10ms, so the buffer after a dropout isn't late too
                    if (when + shift < ctx.currentTime) {
                        shift = ctx.currentTime - when + 0.01;
                        lag.set(ctx, shift);
                        stats.late += 1;
                        stats.lagMs = shift * 1000;
                    }
                    when += shift;
                }
                if (this.buffer) ends.set(this, Math.max(when, ctx.currentTime) + this.buffer.duration);
                stats.buffers += 1;
                if (this.buffer && stats.buffers % 8 === 0) {
                    for (const x of this.buffer.getChannelData(0)) stats.peak = Math.max(stats.peak, Math.abs(x));
                }
                return start.call(this, when, ...rest);
            };
        })();

        // F1 shows the app's Keyboard Shortcuts, but Chrome, Edge and Firefox
        // open their own help on it unless the page says no. The app still
        // hears the key: this only stops the browser's default
        window.addEventListener("keydown", (e) => {
            if (e.key === "F1") e.preventDefault();
        }, { capture: true });

        // A patch link pasted into this tab's address bar changes only the
        // fragment, which doesn't reload the page: the app picks it up and
        // opens it, asking first if there are unsaved changes
        window.addEventListener("hashchange", () => { window.sobaNewHash = location.hash; });

        // Files kept only in the tab (takes, trims, files dropped in) are
        // kept in IndexedDB too, so a reload, or an autosave recovered,
        // finds them again (src/persistence/tab_store.rs). Every open copy
        // of the app notes in localStorage that it's still open, so one
        // starting up tidies away files nobody names only when it's alone.
        window.sobaTabFiles = (function () {
            const ALIVE = "soba-open-";
            // A hidden tab's timers can slow to one a minute
            const GONE_AFTER_MS = 3 * 60 * 1000;
            const me = ALIVE + Math.random().toString(36).slice(2);
            // An embed (?patch=) keeps nothing, so it needn't be waited for
            if (!new URLSearchParams(location.search).has("patch")) {
                const beat = () => { try { localStorage.setItem(me, String(Date.now())); } catch (e) {} };
                beat();
                setInterval(beat, 5000);
                window.addEventListener("pageshow", beat);
                window.addEventListener("pagehide", () => { try { localStorage.removeItem(me); } catch (e) {} });
            }

            let db;
            const open = () => db ??= new Promise((resolve, reject) => {
                const request = indexedDB.open("soba", 1);
                request.onupgradeneeded = () => request.result.createObjectStore("tab-files");
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            // Answers once the transaction is done, so a write is on disk
            const run = (mode, act) => open().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction("tab-files", mode);
                const request = act(transaction.objectStore("tab-files"));
                transaction.oncomplete = () => resolve(request.result);
                transaction.onerror = transaction.onabort = () => reject(transaction.error);
            }));
            return {
                keys: () => run("readonly", (files) => files.getAllKeys()),
                get: (key) => run("readonly", (files) => files.get(key)),
                put: (key, bytes) => run("readwrite", (files) => files.put(bytes, key)),
                remove: (key) => run("readwrite", (files) => files.delete(key)),
                // Whether another copy of the app is open, forgetting any long gone
                othersOpen: () => {
                    let others = false;
                    try {
                        for (const key of Object.keys(localStorage).filter((k) => k.startsWith(ALIVE) && k !== me)) {
                            if (Date.now() - Number(localStorage.getItem(key)) < GONE_AFTER_MS) others = true;
                            else localStorage.removeItem(key);
                        }
                    } catch (e) {
                        return true;
                    }
                    return others;
                },
            };
        })();
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            color: #c8c8dc;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        canvas#soba {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }

        /* Until the app takes over: one cable, carrying a signal */
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 0 16px;
            pointer-events: none;
            background:
                linear-gradient(#24243a 1px, transparent 1px) 0 0 / 24px 24px,
                linear-gradient(90deg, #24243a 1px, transparent 1px) 0 0 / 24px 24px,
                #1a1a2e;
        }
        #loading svg { width: min(280px, 70vw); height: auto; overflow: visible; }
        #loading .cable { fill: none; stroke: #4287f5; stroke-width: 3; stroke-linecap: round; opacity: 0.35; }
        #loading .flow {
            fill: none; stroke: #8db6ff; stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 2 22;
            animation: flow 0.9s linear infinite;
            filter: drop-shadow(0 0 4px #4287f5);
        }
        #loading .jack { fill: #2d2d46; stroke: #4287f5; stroke-width: 2; }
        #loading .name { font-size: 15px; letter-spacing: 0.32em; color: #e6e6f5; font-weight: 600; }
        #loading .hint { font-size: 13px; color: #8a8aa8; max-width: 34em; line-height: 1.5; }
        @keyframes flow { to { stroke-dashoffset: -24; } }
        @media (prefers-reduced-motion: reduce) { #loading .flow { animation: none; } }
    </style>
</head>

<body>
    <canvas id="soba"></canvas>
    <div id="loading">
        <svg viewBox="0 0 280 90" aria-hidden="true">
            <path class="cable" d="M 14 20 C 120 20, 160 70, 266 70" />
            <path class="flow" d="M 14 20 C 120 20, 160 70, 266 70" />
            <circle class="jack" cx="14" cy="20" r="7" />
            <circle class="jack" cx="266" cy="70" r="7" />
        </svg>
        <div class="name">soba</div>
        <div class="hint">Patching the cables…</div>
    </div>
</body>

</html>
